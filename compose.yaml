x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-cyberflow}-backend:local
  pull_policy: never
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://workflow@db:5432/workflow
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    FRONTEND_ORIGINS: '["${APP_BASE_URL:-http://localhost}"]'
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
  init: true
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - workflow_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workflow", "-d", "workflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    build: ./backend
    volumes:
      - log_archive:/var/lib/cyberflow/logs
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        : "$${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}"
        if [ ! -e /var/lib/cyberflow/logs/.cyberflow-destination ]; then
          echo docker-archive > /var/lib/cyberflow/logs/.cyberflow-destination
        fi
        exec alembic -c backend/alembic.ini upgrade head

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend
    volumes:
      - log_archive:/var/lib/cyberflow/logs
    command: ["python", "-m", "backend.app.queue_worker"]

  notifications:
    <<: *backend
    command: ["python", "-m", "backend.app.notification_worker"]

  telegram:
    <<: *backend
    profiles: [telegram]
    command: ["python", "-m", "backend.app.telegram_link_worker"]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-model:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "-ec"]
    command: ['ollama show "$${LLM_MODEL}" >/dev/null 2>&1 || exec ollama pull "$${LLM_MODEL}"']
    restart: on-failure

volumes:
  workflow_pgdata:
  log_archive:
  caddy_data:
  caddy_config:
  ollama_models:
